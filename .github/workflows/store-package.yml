name: MSIX Store Package

on:
  push:
    tags:
      - 'v*.*.*'
      - 'store-v*'

jobs:
  build-msix:
    name: Build MSIX Package
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        shell: powershell
        run: |
          $tag = "${{ github.ref }}".Replace("refs/tags/", "")
          # Convert v1.2.3 to 1.2.3.0
          $version = $tag -replace '^v', ''
          if ($version -notmatch '\d+\.\d+\.\d+\.\d+') {
            $version = "$version.0"
          }
          Write-Output "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Version: $version"

      - name: Setup Visual Studio
        uses: microsoft/setup-msbuild@v1.1

      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmake-version: latest

      - name: Build MSIX Package
        shell: powershell
        run: |
          .\StorePackaging\Scripts\Build-MSIX.ps1 `
            -Version "${{ steps.version.outputs.version }}" `
            -Configuration Release `
            -Architecture x64

      - name: Validate Package
        shell: powershell
        run: |
          $packages = Get-ChildItem -Path "build\store-packages" -Filter "*.msixbundle"
          if ($packages) {
            .\StorePackaging\Scripts\Validate-Package.ps1 -PackagePath $packages[0].FullName
          } else {
            Write-Error "No MSIX package found in output directory"
            exit 1
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        if: success()
        with:
          name: msix-package-${{ steps.version.outputs.version }}
          path: build/store-packages/
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          files: build/store-packages/*.msixbundle
          draft: false
          prerelease: false
          body: |
            # JyGlobalVST MSIX Package v${{ steps.version.outputs.version }}

            This release contains the MSIX package ready for Microsoft Store submission.

            ## Files
            - `JyGlobalVST_${{ steps.version.outputs.version }}_x64.msixbundle` - Ready for Store submission

            ## Next Steps
            1. Download the .msixbundle file
            2. Review [Partner Center Submission Guide](https://github.com/${{ github.repository }}/blob/main/StorePackaging/Documentation/Partner-Center-Submission.md)
            3. Upload to Microsoft Partner Center

            See [MSIX Build Guide](https://github.com/${{ github.repository }}/blob/main/StorePackaging/Documentation/MSIX-Build-Guide.md) for details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish workflow status
        if: always()
        shell: powershell
        run: |
          if (${{ job.status }} -eq 'success') {
            Write-Host "✅ Build workflow completed successfully" -ForegroundColor Green
          } else {
            Write-Host "❌ Build workflow failed" -ForegroundColor Red
            exit 1
          }
