name: MSIX Store Package

on:
  push:
    tags:
      - 'v*.*.*'
      - 'store-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (Major.Minor.Build.Revision)'
        required: true
        default: '1.0.0.0'

# Package identity comes from repository variables (Settings > Actions > Variables).
# These are not secrets - they are embedded in every published package.
#   MSIX_PACKAGE_NAME           Partner Center Identity/@Name, e.g. 12345Contoso.JyGlobalVST
#   MSIX_PUBLISHER              Partner Center Identity/@Publisher, e.g. CN=1B2C3D4E-...
#   MSIX_PUBLISHER_DISPLAY_NAME Partner Center seller display name
#
# If they are unset the workflow still runs, but builds with the placeholder identity
# and marks the artifact as NOT submittable. That keeps the pipeline testable before a
# Partner Center account exists.

jobs:
  build-msix:
    name: Build MSIX Package
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
              $version = '${{ inputs.version }}'
          } else {
              # refs/tags/v1.2.3 or refs/tags/store-v1.2.3 -> 1.2.3
              $version = '${{ github.ref }}' -replace '^refs/tags/', '' -replace '^(store-)?v', ''
          }
          # Normalise to four components
          $parts = $version.Split('.')
          while ($parts.Count -lt 4) { $parts += '0' }
          $version = ($parts[0..3] -join '.')

          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
              Write-Host "::error::Could not derive a valid version from '${{ github.ref }}' (got '$version')"
              exit 1
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Version: $version"

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Build Store package
        id: build
        shell: pwsh
        env:
          MSIX_PACKAGE_NAME: ${{ vars.MSIX_PACKAGE_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $params = @{
              Version       = '${{ steps.version.outputs.version }}'
              Configuration = 'Release'
          }

          if ($env:MSIX_PACKAGE_NAME -and $env:MSIX_PUBLISHER) {
              $params.PackageName          = $env:MSIX_PACKAGE_NAME
              $params.Publisher            = $env:MSIX_PUBLISHER
              $params.PublisherDisplayName = $env:MSIX_PUBLISHER_DISPLAY_NAME
              "submittable=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              Write-Host "Building with Partner Center identity: $env:MSIX_PACKAGE_NAME"
          } else {
              $params.AllowPlaceholderIdentity = $true
              "submittable=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              Write-Host '::warning::MSIX_PACKAGE_NAME / MSIX_PUBLISHER repository variables are not set. Building with the placeholder identity - this package CANNOT be submitted to the Microsoft Store.'
          }

          .\StorePackaging\Scripts\Build-MSIX.ps1 @params

      # Build-MSIX.ps1 already runs Validate-Package.ps1 on the .msix and fails the build
      # on error. Validate the bundle too, since that is the artifact that gets uploaded.
      - name: Validate bundle
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -Path 'build\store-packages\store' -Filter '*.msixbundle' | Select-Object -First 1
          if (-not $bundle) {
              Write-Host '::error::No .msixbundle produced'
              exit 1
          }
          .\StorePackaging\Scripts\Validate-Package.ps1 -PackagePath $bundle.FullName

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: msix-package-${{ steps.version.outputs.version }}
          path: |
            build/store-packages/store/*.msix
            build/store-packages/store/*.msixbundle
            build/store-packages/store/AppxManifest.xml
          retention-days: 30
          if-no-files-found: error

      # Draft, not published: the artifact is an unsigned Store submission package, and
      # publishing it as a public release invites people to sideload something that will
      # not install without the Store signature.
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/store-packages/store/*.msixbundle
          draft: true
          body: |
            # JyGlobalVST MSIX Package v${{ steps.version.outputs.version }}

            Unsigned MSIX bundle for Microsoft Store submission. Partner Center applies
            the Store signature - this file will not sideload as-is. For a locally
            installable build see `StorePackaging/Scripts/Build-MSIX-Local.ps1`.

            **Submittable to the Store:** ${{ steps.build.outputs.submittable }}

            Submission steps and remaining requirements:
            `StorePackaging/Documentation/Partner-Center-Checklist.md`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
