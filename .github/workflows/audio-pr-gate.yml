# .github/workflows/audio-pr-gate.yml
# T130 — Per-PR CI workflow for audio-component PRs.
#
# Runs on every PR that touches audio-engine, driver, chain, vst-host,
# monitoring, or tray-app sources. Gates merge on:
#   1. Build succeeds (Release + Debug)
#   2. All unit / integration / contract tests pass
#   3. 30-minute soak test (xrun count)
#   4. RT-safety audits (T106, T107, T107a)
#   5. Virtualized-loopback latency measurement (software-only)
#   6. CPU usage report
#   7. Code coverage report
#
# Parallelization notes:
# The jobs below are decoupled (no `needs:` chaining) so they all start at t=0.
# Previously everything was serialized behind a monolithic build-and-test job
# that also built Debug *before* running the Release tests, so soak/latency/
# cpu/rt-audit idled for the whole build and then rebuilt Release a second time
# (~3 h wall clock). Now:
#   - rt-audit runs immediately (pure static analysis, no build).
#   - build-and-test builds Release once, runs the test suite + coverage.
#   - build-debug is a separate parallel job, so Debug never delays Release tests.
#   - soak/latency/cpu each build their own Release in parallel (they never
#     consumed build-and-test's output) and start immediately.
# Wall clock is now bounded by the soak job (build + 30-min soak), the longest
# single step, rather than the sum of every build.

name: Audio PR Gate

on:
  pull_request:
    paths:
      - 'src/audio-engine/**'
      - 'src/driver/**'
      - 'src/tray-app/**'
      - 'src/shared/**'
      - 'src/service/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - '.github/workflows/audio-pr-gate.yml'

env:
  BUILD_TYPE: Release

jobs:
  build-and-test:
    name: Build & Test (Windows, Release)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake with Coverage
        run: cmake -B build -A x64 -DJYGLOBALVST_BUILD_TESTS=ON -DJYGLOBALVST_ENABLE_COVERAGE=ON

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Run unit + integration + contract tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Generate coverage report
        # Uses Visual Studio's built-in code coverage via /PROFILE (VS2022 17.9+)
        # Falls back to OpenCppCoverage if available
        run: |
          echo "Generating coverage report..."
          # The coverage data is generated during test execution
          # Upload to Codecov or similar service
          if (Get-Command CodeCoverage.exe -ErrorAction SilentlyContinue) {
            CodeCoverage.exe collect --output build/coverage.coverage
          }
          if (Test-Path build/*.coverage) {
            Write-Host "Coverage data found:"
            Get-ChildItem build/*.coverage | Format-Table FullName, Length
          } else {
            Write-Host "No coverage data generated"
          }

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: build/*.coverage
          if-no-files-found: ignore

  rt-audit:
    name: Real-Time Safety Audit
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run RT-safety audit (T106)
        shell: pwsh
        run: |
          ./tests/audit/rt_audit.ps1 -FailOnFind
          if ($LASTEXITCODE -ne 0) {
            Write-Error "RT-safety audit failed"
            exit 1
          }

      - name: Run header-presence audit (T107)
        shell: pwsh
        run: |
          & .\tests\audit\header_audit.ps1 -FailOnFind
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Header audit failed"
            exit 1
          }

      - name: Run no-i18n audit (T107a)
        shell: pwsh
        run: |
          & .\tests\audit\no_i18n_audit.ps1 -FailOnFind
          if ($LASTEXITCODE -ne 0) {
            Write-Error "No-i18n audit failed"
            exit 1
          }

  build-debug:
    name: Build (Windows, Debug)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -B build -A x64 -DJYGLOBALVST_BUILD_TESTS=ON

      - name: Build Debug
        run: cmake --build build --config Debug --parallel

  soak-test:
    name: 30-Min Soak Test
    runs-on: windows-latest
    # Build (~80-110 min for Release on hosted runners) + 30-min soak +
    # headroom. 90 min was below the build time alone, so this job was
    # *always* cancelled before the soak test even started.
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        # Soak only runs the tray exe — skip the ~59 test binaries to cut
        # the build to what this job actually consumes.
        run: cmake -B build -A x64 -DJYGLOBALVST_BUILD_TESTS=OFF

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Run soak test
        # --soak-test is implemented in src/tray-app/soak/soak_runner.cpp: runs
        # the engine headless for the duration, writes build\soak_report.json
        # (CPU stats + xrun counts), and exits non-zero on xruns or start failure.
        # The tray binary lives in the JUCE artefacts dir (PRODUCT_NAME
        # "JyGlobalVST"), not under build\bin.
        run: |
          .\build\src\tray-app\jyglobalvst_tray_artefacts\Release\JyGlobalVST.exe --soak-test --duration-minutes 30 --report build\soak_report.json
        continue-on-error: false

      - name: Upload soak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-report
          path: build/soak_report.json
          if-no-files-found: warn

  latency-report:
    name: Virtual Loopback Latency
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -A x64 -DJYGLOBALVST_BUILD_TESTS=ON

      - name: Build Release
        # Only the one test this job runs — no need for the other ~58
        # binaries or the tray GUI app.
        run: cmake --build build --config Release --parallel --target us1_empty_chain_passthrough_test

      - name: Run virtual loopback latency test
        # gtest_discover registers "Suite.Test" names, not source-file names:
        # the old -R "us1_empty_chain_passthrough" matched zero tests and the
        # job passed vacuously ("No tests were found!!!"). --no-tests=error
        # makes a future rename/regression fail loudly instead.
        # Skips (no artifact) on device-less runners — upload warns, not fails.
        run: ctest --test-dir build -C Release -R "US1EmptyChainPassthroughTest.WritesLatencyReport" --output-on-failure --no-tests=error

      - name: Upload latency report
        uses: actions/upload-artifact@v4
        with:
          name: latency-report
          path: build/tests/latency_report.json
          if-no-files-found: warn

  cpu-report:
    name: CPU Usage Report
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -A x64 -DJYGLOBALVST_BUILD_TESTS=ON

      - name: Build Release
        # Only the one test this job runs (writes cpu_report.json).
        run: cmake --build build --config Release --parallel --target us4_cpu_warning_test

      - name: Run CPU warning test
        # Was -R "us4_cpu_warning" — matches no registered test name, so the
        # job passed without running anything.
        run: ctest --test-dir build -C Release -R "US4CpuWarningTest.WritesCpuReport" --output-on-failure --no-tests=error

      - name: Upload CPU report
        uses: actions/upload-artifact@v4
        with:
          name: cpu-report
          path: build/tests/cpu_report.json
          if-no-files-found: warn
