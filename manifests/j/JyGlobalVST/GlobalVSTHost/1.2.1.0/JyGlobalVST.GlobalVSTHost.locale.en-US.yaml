ShortDescription: Route Windows system audio through VST3 effects and built-in processors.
Description: >-
  Captures your PC's system audio via WASAPI loopback, runs it through an
  ordered chain of VST3 and built-in effects, and plays the result to any
  output device you choose. No driver, no virtual device, no reboot. Ships
  with a compressor and a 10-band EQ so it is useful without third-party
  plugins.
